name: Runner Diagnostic

on:
  push:
    branches: [automation/style-menu-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Runner alive
        run: |
          echo "runner-started"
          uname -a
          echo "ok"
