name: Exaucee build preflight

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  preflight:
    name: Exaucee full prestart
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install production dependencies
        run: npm install --omit=dev

      - name: Syntax-check high-risk files before patching
        run: |
          node --check ai_chat/runtime.js
          node --check ai_chat/ai/zeroCostRouter.js
          node --check ai_chat/knowledge/creatorProfile.js
          node --check ai_chat/cognition/intentOrchestrator.js
          node --check scripts/install-exaucee-research.js
          node --check scripts/install-exaucee-bot-knowledge.js
          node --check scripts/install-exaucee-intent-orchestrator.js
          node --check scripts/install-hot-command-updater.js
          node --check scripts/install-hot-oidc-auth.js

      - name: Run the real bot prestart chain
        env:
          CI: 'true'
        run: npm run prestart

      - name: Verify patched runtime syntax
        run: |
          node --check index.js
          node --check handler.js
          node --check api/server.js
          node --check ai_chat/runtime.js

      - name: Run Exaucee regression tests
        run: |
          node --test tests/exaucee-core.test.js tests/exaucee-runtime.test.js tests/exaucee-dynamic.test.js tests/exaucee-bootstrap.test.js
          if [ -f tests/exaucee-cognition.test.js ]; then node --test tests/exaucee-cognition.test.js; fi
          if [ -f tests/exaucee-multigame.test.js ]; then node --test tests/exaucee-multigame.test.js; fi
          if [ -f tests/exaucee-social-context.test.js ]; then node --test tests/exaucee-social-context.test.js; fi
          if [ -f tests/exaucee-research.test.js ]; then node --test tests/exaucee-research.test.js; fi

      - name: Run HOT updater regression tests
        run: npm run test:hot-updater

      - name: Validate command registry
        run: npm run validate:commands
