name: Validate commands

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  menu-images:
    name: Menu image links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit every configured menu image URL
        run: npm run audit:menu-images
      - name: Upload image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-image-audit
          path: menu-image-audit.json
          if-no-files-found: warn

  commands:
    name: Commands four-pass audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install production dependencies
        run: npm install --omit=dev
      - name: Test direct category menu phrases
        run: node --test tests/category-menu.test.js
      - name: Validate all commands
        if: always()
        run: npm run validate:commands
      - name: Audit every command four times
        if: always()
        run: npm run audit:commands:4x
      - name: Upload command report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-audit-report
          path: command-audit-report.json
          if-no-files-found: warn
