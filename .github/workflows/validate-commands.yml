name: Validate commands

on:
  push:
    branches: [main, feature/exaucee]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-commands-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exaucee:
    name: Exaucee runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install production dependencies
        run: npm install --omit=dev
      - name: Run Exaucee tests
        run: node --test tests/exaucee-core.test.js tests/exaucee-runtime.test.js tests/exaucee-dynamic.test.js tests/exaucee-bootstrap.test.js
      - name: Install Exaucee hooks
        run: node scripts/install-exaucee.js
      - name: Verify final handler and bootstrap syntax
        run: |
          node --check handler.js
          node --check index.js
      - name: Verify hook idempotence
        run: node scripts/install-exaucee.js
      - name: Verify Exaucee module syntax
        run: |
          node --check ai_chat/runtime.js
          node --check ai_chat/core/index.js
          node --check ai_chat/router/socialRouter.js
          node --check ai_chat/scheduler/persistentScheduler.js
          node --check ai_chat/dynamic/registry.js

  menu-images:
    name: Menu image links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit every configured menu image URL
        run: npm run audit:menu-images
      - name: Upload image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-image-audit
          path: menu-image-audit.json
          if-no-files-found: warn

  commands:
    name: Commands four-pass audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install production dependencies
        run: npm install --omit=dev
      - name: Install response discipline in final handler
        run: node scripts/install-response-style.js
      - name: Test direct category menu phrases
        run: node --test tests/category-menu.test.js
      - name: Test all 21 disciplined response styles
        run: node --test tests/response-style.test.js
      - name: Validate all commands
        if: always()
        run: npm run validate:commands
      - name: Audit every command four times
        if: always()
        run: npm run audit:commands:4x
      - name: Audit legacy response decorations across all commands
        if: always()
        run: npm run audit:visual-responses
      - name: Audit silent response risks across all commands
        if: always()
        run: npm run audit:silent-responses
      - name: Upload command reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-audit-report
          path: |
            command-audit-report.json
            response-style-audit.json
            silent-response-audit.json
          if-no-files-found: warn
