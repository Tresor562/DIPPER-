name: Validate commands

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install production dependencies
        run: npm install --omit=dev

      - name: Test direct category menu phrases
        run: node --test tests/category-menu.test.js

      - name: Validate all commands
        run: npm run validate:commands

      - name: Audit every command four times
        run: npm run audit:commands:4x

      - name: Audit every configured menu image URL
        run: npm run audit:menu-images

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: big-dipper-audit-reports
          path: |
            command-audit-report.json
            menu-image-audit.json
          if-no-files-found: warn
