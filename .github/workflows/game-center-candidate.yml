name: Game Center Candidate

on:
  push:
    branches: [candidate/game-center-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: game-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game-center:
    name: Game Center regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install production dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Game Center syntax and idempotent install
        run: |
          node --check utils/gameCenterEngine.js
          node --check utils/gameCenterBlock2.js
          node --check utils/gameCenterWhatsappBlock2.js
          node --check utils/gameCenterBlock3.js
          node --check utils/gameCenterWhatsappBlock3.js
          node --check utils/gameCenterBlock4.js
          node --check utils/gameCenterWhatsappBlock4.js
          node --check utils/gameCenterBlock5.js
          node --check utils/gameCenterWhatsappBlock5.js
          node --check utils/gameCenterBlock6.js
          node --check utils/gameCenterWhatsappBlock6.js
          node --check commands/games_entertainment/gamecenter.js
          node --check commands/games_entertainment/rpspick.js
          node --check commands/games_entertainment/anon.js
          node --check scripts/install-game-center.js
          node scripts/install-game-center.js
          node scripts/install-game-center.js
          test "$(grep -c '\[DIPPER GAME CENTER V1\]' handler.js)" -eq 1
      - name: Game Center tests and WhatsApp simulations
        run: npm run test:game-center
      - name: Existing command validation
        run: npm run validate:commands
      - name: Existing command four-pass audit
        run: npm run audit:commands:4x
      - name: Prepare response discipline before style audits
        run: |
          node scripts/install-response-style.js
          node scripts/install-game-center.js
          test "$(grep -c '\[DIPPER GAME CENTER V1\]' handler.js)" -eq 1
      - name: Existing response-style audits
        run: |
          npm run audit:visual-responses
          npm run audit:silent-responses

  full-suite:
    name: Candidate full existing test suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install production dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Syntax-check candidate before full suite
        run: |
          node --check handler.js
          node --check index.js
          node --check api/server.js
          node --check utils/gameCenterEngine.js
          node --check utils/gameCenterBlock2.js
          node --check utils/gameCenterWhatsappBlock2.js
          node --check utils/gameCenterBlock3.js
          node --check utils/gameCenterWhatsappBlock3.js
          node --check utils/gameCenterBlock4.js
          node --check utils/gameCenterWhatsappBlock4.js
          node --check utils/gameCenterBlock5.js
          node --check utils/gameCenterWhatsappBlock5.js
          node --check utils/gameCenterBlock6.js
          node --check utils/gameCenterWhatsappBlock6.js
          node --check commands/games_entertainment/gamecenter.js
          node --check commands/games_entertainment/rpspick.js
          node --check commands/games_entertainment/anon.js
      - name: Full existing test suite on candidate
        run: node --test --test-force-exit tests/

  stable-control:
    name: Stable main full-suite control
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install stable production dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Full existing test suite on untouched main
        run: node --test --test-force-exit tests/

  render-sim:
    name: Game Center Render + health simulation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
      PORT: '10000'
      PUBLIC_MODE: 'true'
      RENDER: 'true'
      NODE_ENV: 'production'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Clean Render-like install
        run: npm install --no-audit --no-fund
      - name: Render prestart installers
        run: npm run prestart
      - name: Prestart idempotence and Game Center hook survival
        run: |
          npm run prestart
          test "$(grep -c '\[DIPPER GAME CENTER V1\]' handler.js)" -eq 1
          node --check handler.js
          node --check index.js
          node --check api/server.js
          node --check utils/gameCenterBlock3.js
          node --check utils/gameCenterWhatsappBlock3.js
          node --check utils/gameCenterBlock4.js
          node --check utils/gameCenterWhatsappBlock4.js
          node --check utils/gameCenterBlock5.js
          node --check utils/gameCenterWhatsappBlock5.js
          node --check utils/gameCenterBlock6.js
          node --check utils/gameCenterWhatsappBlock6.js
          node --check commands/games_entertainment/anon.js
      - name: 100000 style and menu simulations
        run: npm run test:style-menu
      - name: Render static simulator
        run: npm run render:simulate
      - name: Validate all commands after Render installers
        run: npm run validate:commands
      - name: Game Center tests after Render installers
        run: npm run test:game-center
      - name: Boot and healthcheck
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/dipper-game-center-boot.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 25); do
            if curl --silent --fail http://127.0.0.1:${PORT}/health | grep -q '"status":"ok"'; then
              ok=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat /tmp/dipper-game-center-boot.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            cat /tmp/dipper-game-center-boot.log
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo 'Game Center Render boot + /health OK'
